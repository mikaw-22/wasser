<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete" />
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/img/palm.png">
    <link rel="apple-touch-icon" href="assets/img/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Wasserwart">
    <title>Alles für Malle</title>
</head>
<body>
    
    <div class="nav_container">
        <nav>
            <div class="menu" onclick="menuFunction(this)">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </div>

            <div class="date_time">
                <p id="date_time"></p>
            </div>

            <div class="saeulen_tracker">
                <p id="tracker">1.5 Säulen</p>
            </div>
        </nav>

        <nav class="menuLinks" id="navLinks">
            <p class="menuP" style="font-weight: bold;"><a href="players.html">Home</a></p>
            <p class="menuP">Säulen</p>
            <p class="menuP"><a href="index.html">Logout</a></p>
        </nav>
    </div>

    <main>

        <div class="header-row">

            <h2>Aufschlüsselung:</h2>

            <div class="filter-area">

                <div class="filters" id="filters">

                    <select id="filterPlayer">
                        <option value="">Alle Spieler</option>
                    </select>

                    <select id="filterPaid">
                        <option value="">Bezahlt / Unbezahlt</option>
                        <option value="true">Bezahlt</option>
                        <option value="false">Nicht bezahlt</option>
                    </select>

                    <select id="filterGameday">
                        <option value="">Spieltag / Kein Spieltag</option>
                        <option value="true">Spieltag</option>
                        <option value="false">Kein Spieltag</option>
                    </select>

                    <label>
                        <span style="font-size: 12.5px;">Von:</span>
                        <input type="date" id="filterDateFrom">
                    </label>

                    <label>
                        <span style="font-size: 12.5px;">Bis:</span>
                        <input type="date" id="filterDateTo">
                    </label>

                </div>

                <i class="fa-solid fa-filter" onclick="filterFunction(this)"></i>

            </div>

        </div>

        <div id="invoices"></div>

    </main>

    <div class="popup" id="deletePopup">
        <div class="popup-content">

            <div class="popup-question">
                <span>Eintrag wirklich löschen?</span>
            </div>

            <div class="popup-buttons">
                <button id="cancelDelete" style="background-color: rgba(255, 0, 0, 0.11);">Nein</button>
                <button id="confirmDelete" style="background-color: rgba(0, 128, 0, 0.11);">Ja</button>
            </div>

        </div>
    </div>

    <div class="success-notification" id="nophotoNotification">

        <div class="success-content">

            <!--<div class="success-icon">
                <i class="fa-solid fa-camera"></i>
            </div>-->

            <div class="success-text">
                Kein Foto
            </div>

        </div>

        <div class="fail-progress"></div>

    </div>

    <div class="photo-popup" id="photoPopup">

        <div class="photo-popup-content">

            <button class="close-photo-popup" id="closePhotoPopup">
                <i class="fa-solid fa-close"></i>
            </button>

            <img id="invoicePhoto" src="" alt="Invoice Foto">

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/table.js"></script>
</body>
</html>

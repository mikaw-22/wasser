<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete" />
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/img/palm.png">
    <link rel="apple-touch-icon" href="assets/img/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Wasserwart">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Alles für Malle</title>
</head>
<body>
    
    <div class="nav_container">
        <nav>
            <div class="menu" onclick="menuFunction(this)">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </div>

            <div class="date_time">
                <p id="date_time"></p>
            </div>

            <div class="saeulen_tracker">
                <p id="tracker">1.5 Säulen</p>
            </div>
        </nav>

        <nav class="menuLinks" id="navLinks">
            <p class="menuP"><a href="table.html">Tabelle</a></p>
            <p class="menuP">Säulen</p>
            <p class="menuP"><a href="index.html">Logout</a></p>
        </nav>
    </div>

    <main>
        <h2>Eintrag erstellen:</h2>
        <div id="players"></div>
    </main>

    <div class="player-popup" id="playerPopup">

        <div class="player-popup-content">

            <button class="popup-cancel" id="cancelPlayerPopup" title="Abbrechen">
                <span class="material-symbols-outlined">
                    delete
                </span>
            </button>


            <h2 id="popupPlayerName">
                Spieler eintragen
            </h2>


            <label class="popup-checkbox">
                <input type="checkbox" id="matchdayCheckbox">
                <span>Matchday ×2</span>
            </label>


            <div class="photo-upload">

                <label for="playerPhoto" id="photoUploadLabel">
                    <i class="fa-solid fa-camera"></i>
                    Foto hinzufügen
                </label>

                <input type="file" id="playerPhoto" accept="image/*" capture="environment">

                <p id="selectedPhotoName"></p>

            </div>


            <button class="popup-submit" id="submitPlayer">
                Submit
            </button>

        </div>

    </div>

    <div class="success-notification" id="successNotification">
        <div class="success-content">
            <!--<div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>-->

            <div class="success-text">
                Eintrag hinzugefügt.
            </div>
        </div>

        <div class="success-progress"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=delete" />
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/img/palm.png">
    <link rel="apple-touch-icon" href="assets/img/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Wasserwart">
    <title>Alles für Malle</title>
</head>
<body>
    
    <nav class="login_nav">
        <p id="date_time"></p>
    </nav>

    <main class="login_cont">
        <div class="">
            <span class="password">Password:</span>
            <input type="password" id="zugang">
            
        </div><button onclick="login()">Login</button>
    </main>

    <div class="false-password-popup" id="falsePasswordPopup">
        <div class="popup-content">

            <div class="popup-question">
                <span>Falsches Passwort.</span>
            </div>

            <div class="popup-buttons">
                <button id="closeFalsePasswordPopup" style="background-color: rgba(255, 0, 0, 0.11); color:#000">
                    Okay
                </button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/login.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
